<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-labelledby="yap-icon-title">
  <title id="yap-icon-title">YAP</title>
  <style>
    text {
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Consolas", "Monaco", monospace;
      font-size: 14px;
      white-space: pre;
      dominant-baseline: middle;
    }
    /* Light mode primary color: oklch(53.11% 0.1062 234.34) = #1375a0 */
    @media (prefers-color-scheme: light) {
      text {
        fill: #1375a0;
      }
    }
    /* Dark mode primary color: oklch(78.69% 0.1165 192.26) = #47d1cd */
    @media (prefers-color-scheme: dark) {
      text {
        fill: #47d1cd;
      }
    }
    /* Fallback for browsers that don't support media queries in SVG */
    text {
      fill: #3498a8;
    }
  </style>
